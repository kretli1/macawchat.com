<style>
/* ===== MacawChat · Neobrutalismo =====
   Papel + tinta + 3 acentos da marca (amarelo = ação, azul = blocos secundários,
   verde = sucesso), mais o marinho da marca como bloco escuro.
   Toda superfície: borda de 3px, sombra dura (0 de blur), raio único de 8px. */
:root {
  --paper: #FAFAF5;
  --paper-2: #F1EFE6;
  --ink: #111111;
  --amarelo: #FFD400;
  --azul: #0E73E8;
  --verde: #4CC84C;
  --marinho: #03235C;
  --rosa: #FF5C00;
  --on-azul: #FFFFFF;
  --b: 3px solid var(--ink);
  --r: 8px;
  --r-sm: 6px;
  --s-sm: 3px 3px 0 0 var(--ink);
  --s: 4px 4px 0 0 var(--ink);
  --s-lg: 6px 6px 0 0 var(--ink);
  --s-xl: 8px 8px 0 0 var(--ink);
  --font: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --snap: 100ms steps(1, end);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #14140F;
    --paper-2: #1E1E17;
    --ink: #FAFAF5;
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font-family: var(--font); font-size: 16px; font-weight: 500; line-height: 1.55;
  -webkit-font-smoothing: antialiased; overflow-wrap: break-word;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--font); margin: 0; font-weight: 800; letter-spacing: -0.01em; line-height: 1.0; }
p { margin: 0; }
.wrap { width: min(1280px, 100% - 40px); margin-inline: auto; }
@media (min-width: 640px) { .wrap { width: min(1280px, 100% - 64px); } }
.section { padding-block: clamp(64px, 8vw, 112px); position: relative; }
.center { text-align: center; }
.center .h2, .center .lead { margin-inline: auto; }

/* Tipografia */
.eyebrow, .label {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--mono); font-weight: 700; font-size: 13px; line-height: 1.1;
  letter-spacing: .04em; text-transform: uppercase;
  padding: 6px 10px; border: 2px solid var(--ink); border-radius: var(--r-sm);
  background: var(--amarelo); color: #111; box-shadow: var(--s-sm);
}
.h2 { font-size: clamp(32px, 5vw, 72px); font-weight: 800; letter-spacing: -0.02em; line-height: .96; margin-top: 20px; max-width: 18ch; }
.lead { font-size: clamp(17px, 1.6vw, 19px); line-height: 1.5; margin-top: 20px; max-width: 46ch; }
/* Destaque: caixa de marca-texto com borda, nunca gradiente */
.grad {
  display: inline; padding: 0 .12em; margin-left: -.06em;
  background: var(--amarelo); color: #111; border: 3px solid var(--ink); border-radius: var(--r-sm);
  box-shadow: var(--s); -webkit-box-decoration-break: clone; box-decoration-break: clone;
  line-height: 1.12;
}
.meta .grad, .cta .grad { background: var(--verde); }

/* Botões: sobem no hover, afundam na sombra ao apertar */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 0 24px; border: var(--b); border-radius: var(--r);
  font-family: var(--font); font-weight: 800; font-size: 16px; text-decoration: none;
  cursor: pointer; white-space: nowrap; color: #111; background: var(--paper);
  box-shadow: var(--s);
  transition: transform var(--snap), box-shadow var(--snap);
}
.btn:hover { transform: translate(-1px, -1px); box-shadow: 6px 6px 0 0 var(--ink); }
.btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 0 var(--ink); }
.btn-primary, .btn-amarelo { background: var(--amarelo); color: #111; }
.btn-ghost { background: var(--paper); color: var(--ink); }
.btn:focus-visible, a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
.btn .seta { display: flex; }

/* Logo: dentro do próprio bloco */
.logo { height: 34px; width: auto; }
.marca-bloco { display: inline-flex; align-items: center; padding: 6px 0; border-radius: var(--r); }

/* Barra: sólida desde o topo, borda grossa embaixo, sem vidro */
.nav { position: sticky; top: 0; z-index: 50; background: var(--paper); border-bottom: 4px solid var(--ink); }
.nav-in { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 72px; }
.nav-in > a { text-decoration: none; }
.nav-links { display: flex; align-items: center; gap: 24px; }
.nav-links a {
  font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  text-decoration: none; padding: 6px 0; border-bottom: 3px solid transparent;
}
.nav-links a:hover { border-bottom-color: var(--ink); }
.nav-acoes { display: flex; align-items: center; gap: 12px; }
.nav-acoes .btn { min-height: 44px; padding: 0 16px; font-size: 15px; }
.menu-btn {
  display: none; width: 44px; height: 44px; border: var(--b); border-radius: var(--r);
  background: var(--paper); box-shadow: var(--s-sm); cursor: pointer; align-items: center; justify-content: center;
  transition: transform var(--snap), box-shadow var(--snap);
}
.menu-btn:active { transform: translate(3px, 3px); box-shadow: none; }
.gaveta { display: none; }
@media (max-width: 920px) {
  .nav-links, .nav-acoes .entrar { display: none; }
  .menu-btn { display: inline-flex; }
  .gaveta {
    display: none; flex-direction: column; gap: 0;
    position: absolute; left: 12px; right: 12px; top: calc(100% + 12px);
    padding: 8px 16px 20px; background: var(--paper); border: var(--b); border-radius: var(--r); box-shadow: var(--s-lg);
    max-height: calc(100dvh - 100px); overflow-y: auto;
  }
  .gaveta.aberta { display: flex; }
  .gaveta a:not(.btn) { padding: 12px 0; min-height: 44px; text-decoration: none; font-weight: 800; font-size: 26px; letter-spacing: -0.01em; border-bottom: 3px solid var(--ink); }
  .gaveta .btn { margin-top: 16px; }
}
@media (max-width: 400px) { .nav-acoes .btn-primary { display: none; } }

/* Topo: assimétrico, texto 58% e visual 42% deslocado */
.hero { padding-top: clamp(40px, 6vw, 72px); padding-bottom: 0; position: relative; }
.hero-grid { display: grid; grid-template-columns: minmax(0, 58fr) minmax(0, 42fr); gap: clamp(32px, 5vw, 64px); align-items: start; }
.hero-grid > :last-child { margin-top: clamp(0px, 4vw, 56px); }
@media (max-width: 960px) { .hero-grid { grid-template-columns: minmax(0, 1fr); } .hero-grid > :last-child { margin-top: 0; } }
.selo-topo {
  display: inline-flex; align-items: center; gap: 10px; max-width: 100%;
  padding: 6px 12px 6px 6px; border: 2px solid var(--ink); border-radius: var(--r-sm); background: var(--paper);
  box-shadow: var(--s-sm); font-family: var(--mono); font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; line-height: 1.3;
}
.selo-topo .pill { background: var(--verde); color: #111; border: 2px solid var(--ink); border-radius: 4px; padding: 2px 8px; white-space: nowrap; flex: none; }
.hero h1 {
  font-size: clamp(40px, 6.6vw, 96px); font-weight: 900; letter-spacing: -0.03em; line-height: .92;
  margin-top: 24px; max-width: 13ch;
}
.hero h1 .grad { line-height: 1.04; }
.hero .lead { max-width: 46ch; }
.hero-ctas { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 32px; }
.hero-nota { margin-top: 24px; display: flex; gap: 10px; flex-wrap: wrap; }
.hero-nota span {
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700;
  padding: 4px 10px; border: 2px solid var(--ink); border-radius: var(--r-sm); background: var(--paper);
}
.hero-nota svg { color: var(--ink); }

/* Celular: aparelho emoldurado, sem balanço */
.celular-area { position: relative; display: flex; flex-direction: column; align-items: center; padding: 8px 0 24px; }
.celular {
  width: min(340px, 100%); aspect-ratio: 9 / 18.5; border-radius: 36px; padding: 10px;
  background: #111; border: var(--b); box-shadow: var(--s-xl); position: relative;
}
@media (min-width: 640px) { .celular { rotate: 2deg; } }
.tela { height: 100%; border-radius: 26px; overflow: hidden; background: #0B141A; display: flex; flex-direction: column; border: 2px solid #111; }
.tela-topo { display: flex; align-items: center; gap: 10px; padding: 18px 16px 12px; background: #1F2C34; color: #E9EDEF; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--amarelo); border: 2px solid #111; display: grid; place-items: center; color: #111; font-weight: 900; font-size: 14px; flex: none; }
.tela-topo b { font-size: 14px; display: block; }
.tela-topo small { font-size: 11px; color: #8FA3AE; }
.tela.ig, .tela.ms { background: #000; }
.tela.ig .tela-topo, .tela.ms .tela-topo { background: #000; border-bottom: 1px solid #262626; }
.tela.ig .avatar { background: #FF3EA5; }
.tela.ms .avatar { background: var(--azul); color: #fff; }
.tela.ig .msg, .tela.ms .msg { border-radius: 14px; }
.tela.ig .msg.lead { background: #262626; }
.tela.ig .msg.bot { background: #6A3DF0; }
.tela.ig .msg .quem { color: #D9CCFF; }
.tela.ms .msg.lead { background: #303030; }
.tela.ms .msg.bot { background: #0866FF; }
.tela.ms .msg .quem { color: #CFE0FF; }
.tela.tg { background: #0E1621; }
.tela.tg .tela-topo { background: #17212B; border-bottom: 1px solid #0B121A; }
.tela.tg .avatar { background: #2AABEE; color: #fff; }
.tela.tg .msg { border-radius: 14px; }
.tela.tg .msg.lead { background: #182533; }
.tela.tg .msg.bot { background: #2B5278; }
.tela.tg .msg .quem { color: #8CC8F0; }
.msgs { flex: 1; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; justify-content: flex-end; overflow: hidden; }
.msg { max-width: 82%; padding: 7px 10px 6px; border-radius: 10px; font-size: 13px; line-height: 1.4; color: #E9EDEF; animation: carimbo .25s cubic-bezier(.2,.9,.3,1) both; }
.msg small { display: block; font-size: 10px; font-weight: 700; opacity: .75; margin-bottom: 2px; }
.msg.lead { align-self: flex-start; background: #1F2C34; border-top-left-radius: 2px; }
.msg.bot { align-self: flex-end; background: #005C4B; border-top-right-radius: 2px; }
.msg .quem { display: block; font-size: 10px; font-weight: 700; color: #7FD4C1; margin-bottom: 2px; }
.msg.arquivo { display: flex; align-items: center; gap: 8px; }
.msg.arquivo .doc { width: 28px; height: 34px; border-radius: 4px; background: #E9EDEF; color: #C0392B; display: grid; place-items: center; font-size: 9px; font-weight: 800; flex: none; }
.msg.comentario { align-self: flex-start; background: #121212; box-shadow: inset 0 0 0 1px #363636; }
.msg.publica { align-self: flex-end; background: #121212; box-shadow: inset 0 0 0 1px #3797F0; }
.botao-msg { display: block; margin-top: 8px; padding: 6px 10px; border-radius: 8px; background: rgba(255,255,255,.18); text-align: center; font-weight: 700; }
.digitando { align-self: flex-end; background: #005C4B; border-radius: 10px; padding: 10px 12px; display: flex; gap: 4px; }
.digitando i { width: 6px; height: 6px; border-radius: 50%; background: #CFE9E2; animation: pisca 900ms steps(1, end) infinite; }
.digitando i:nth-child(2) { animation-delay: .3s; } .digitando i:nth-child(3) { animation-delay: .6s; }
@keyframes pisca { 0% { opacity: 1; } 50% { opacity: .3; } }
@keyframes carimbo { 0% { opacity: 0; transform: translateY(8px); } 70% { opacity: 1; transform: scale(1.03); } 100% { transform: none; } }
/* Adesivos sobre o celular */
.venda, .chip-ia {
  position: absolute; z-index: 2; width: max-content; white-space: nowrap;
  display: flex; gap: 10px; align-items: center; border: var(--b); border-radius: var(--r); box-shadow: var(--s);
  color: #111;
}
.venda { right: max(-16px, -2vw); top: 16%; background: var(--verde); padding: 12px 16px; rotate: -3deg; animation: carimbo .25s cubic-bezier(.2,.9,.3,1) both; }
.venda b { display: block; font-size: 16px; font-weight: 900; }
.venda small { font-size: 12px; font-weight: 600; }
.chip-ia { left: max(-12px, -2vw); bottom: 14%; background: var(--amarelo); padding: 10px 14px; font-size: 13px; font-weight: 800; rotate: 2deg; }
.venda svg, .chip-ia svg { flex: none; }
@media (max-width: 639px) { .venda, .chip-ia { rotate: none; } .venda { right: 0; } .chip-ia { left: 0; } }

/* Faixa de confiança: blocos colados lado a lado */
.faixa-meta { margin-top: clamp(48px, 6vw, 80px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 0; border: var(--b); border-radius: var(--r); box-shadow: var(--s-lg); overflow: hidden; background: var(--paper); }
.faixa-item { display: flex; gap: 12px; align-items: center; padding: 18px 20px; font-weight: 800; font-size: 15px; line-height: 1.25; border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); margin: 0 -3px -3px 0; }
.faixa-item:nth-child(1) { background: var(--amarelo); color: #111; }
.faixa-item:nth-child(3) { background: var(--azul); color: var(--on-azul); }
.faixa-item svg { flex: none; }

/* Faixa rolante de rótulos */
.letreiro { margin-top: clamp(56px, 7vw, 96px); border-block: 4px solid var(--ink); background: var(--ink); color: var(--paper); overflow: hidden; }
.letreiro-trilho { display: flex; width: max-content; animation: rola 30s linear infinite; }
.letreiro:hover .letreiro-trilho { animation-play-state: paused; }
.letreiro-grupo { display: flex; align-items: center; }
.letreiro-grupo span { display: inline-flex; align-items: center; gap: 24px; padding: 14px 0 14px 24px; font-weight: 900; font-size: clamp(18px, 2.4vw, 28px); letter-spacing: -0.01em; text-transform: uppercase; white-space: nowrap; }
.letreiro-grupo span::after { content: ""; width: 14px; height: 14px; background: var(--amarelo); border: 2px solid var(--paper); flex: none; }
.letreiro-grupo span:nth-child(3n+2)::after { background: var(--verde); }
.letreiro-grupo span:nth-child(3n)::after { background: var(--azul); }
@keyframes rola { to { transform: translateX(-50%); } }

/* Seção Meta: bloco marinho inteiro com bordas */
.meta { background: var(--marinho); color: #fff; border-block: 4px solid var(--ink); }
.meta .h2, .meta .lead { color: #fff; }
.meta-bg { display: none; }
.selao {
  margin-top: 40px; width: fit-content; max-width: 100%;
  display: flex; align-items: center; gap: 16px; padding: 16px 20px;
  background: var(--amarelo); color: #111; border: 3px solid #111; border-radius: var(--r); box-shadow: 8px 8px 0 0 #111;
  rotate: -1deg;
}
.selao .escudo { flex: none; }
.selao b { font-size: clamp(17px, 2.4vw, 24px); font-weight: 900; display: block; line-height: 1.1; letter-spacing: -0.01em; }
.selao small { font-family: var(--mono); font-size: 12px; font-weight: 700; display: block; margin-top: 6px; }
.meta-grid { margin-top: 56px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 28px; }
@media (min-width: 1000px) { .meta-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } .meta-grid > :nth-child(3n+2) { translate: 0 16px; } }
.meta-card { padding: 24px; border: 3px solid #111; border-radius: var(--r); background: #fff; color: #111; box-shadow: 6px 6px 0 0 #111; }
.meta-card:nth-child(2) { background: var(--amarelo); }
.meta-card:nth-child(4) { background: var(--verde); }
.meta-card h3 { font-size: 22px; margin-top: 16px; }
.meta-card p { margin-top: 10px; font-size: 15px; }
.compara { margin-top: 64px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 28px; }
.compara-col { padding: 24px; border: 3px solid #111; border-radius: var(--r); box-shadow: 6px 6px 0 0 #111; color: #111; }
.compara-col.ruim { background: #fff; }
.compara-col.bom { background: var(--verde); box-shadow: 8px 8px 0 0 #111; }
.compara-col h3 { font-size: 20px; display: flex; align-items: center; gap: 10px; }
.compara-col ul { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 12px; }
.compara-col li { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
.compara-col li svg { flex: none; margin-top: 2px; }
.ruim li { text-decoration: line-through; text-decoration-thickness: 2px; }
.nota-marca { margin-top: 40px; font-family: var(--mono); font-size: 12px; font-weight: 700; color: #fff; }

/* Canais: faixa de logos entre bordas */
.canais { padding-block: 40px 0; }
.canais-tit { text-align: center; font-weight: 800; font-size: clamp(18px, 2vw, 22px); line-height: 1.25; margin: 0 auto 24px; width: min(1280px, 100% - 40px); }
@media (min-width: 640px) { .canais-tit { width: min(1280px, 100% - 64px); } }
.trilho { display: flex; width: max-content; animation: rola 28s linear infinite; }
.canais > .trilho { border-block: 3px solid var(--ink); }
.canais { overflow: hidden; }
.trilho:hover { animation-play-state: paused; }
.trilho-grupo { display: flex; align-items: center; }
.logo-canal { width: 104px; height: 88px; padding: 18px 24px; object-fit: contain; border-right: 3px solid var(--ink); background: var(--paper); }
.trilho-grupo:nth-child(odd) .logo-canal:nth-child(even), .trilho-grupo:nth-child(even) .logo-canal:nth-child(odd) { background: var(--amarelo); }

/* Ícone em quadrado de cor, com borda e sombra */
.caso-ic, .rec .ic, .tile-ic {
  display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px; flex: none;
  border: 3px solid #111; border-radius: var(--r-sm); background: var(--azul); color: #fff; box-shadow: 3px 3px 0 0 #111;
}
.caso-ic svg, .rec .ic svg { width: 26px; height: 26px; stroke-width: 2.75; }

/* Casos de uso: blocos com cores alternadas */
.casos { margin-top: 56px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 270px), 1fr)); gap: 28px; }
.caso {
  display: flex; flex-direction: column; padding: 24px; border: var(--b); border-radius: var(--r); background: var(--paper);
  box-shadow: var(--s-lg); transition: transform var(--snap), box-shadow var(--snap);
}
.caso:hover { transform: translate(-2px, -2px); box-shadow: var(--s-xl); }
.caso:nth-child(4n+1) { background: var(--amarelo); color: #111; }
.caso:nth-child(4n+3) { background: var(--verde); color: #111; }
.caso:nth-child(4n+1) .caso-ic, .caso:nth-child(4n+3) .caso-ic { background: #fff; color: #111; }
.caso h3 { margin-top: 18px; font-size: 22px; }
.caso p { margin: 10px 0 18px; font-size: 15px; }
.pilulas { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
.pilulas span {
  padding: 3px 8px; border: 2px solid var(--ink); border-radius: 4px; font-family: var(--mono); font-size: 11px; font-weight: 700;
  letter-spacing: .02em; text-transform: uppercase; background: var(--paper); color: var(--ink);
}
.caso:nth-child(4n+1) .pilulas span, .caso:nth-child(4n+3) .pilulas span { border-color: #111; background: #fff; color: #111; }
.gatilhos { margin-top: 40px; padding: 24px; border: var(--b); border-radius: var(--r); box-shadow: var(--s-lg); background: var(--paper-2); }
.gatilhos > p { display: flex; align-items: center; gap: 8px; margin: 0 0 16px; font-weight: 900; font-size: 20px; }

/* Módulos: abas que afundam quando escolhidas */
.mod-abas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 40px; }
.mod-aba {
  display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 8px 14px; cursor: pointer;
  border: var(--b); border-radius: var(--r); background: var(--paper); color: var(--ink); font-weight: 800; font-size: 15px;
  box-shadow: var(--s); transition: transform var(--snap), box-shadow var(--snap);
}
.mod-aba:hover { transform: translate(-1px, -1px); box-shadow: 6px 6px 0 0 var(--ink); }
.mod-aba[data-on="true"] { background: var(--azul); color: #fff; transform: translate(4px, 4px); box-shadow: none; }
.mod-aba svg { flex: none; }
.mod-itens { margin-top: 32px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 0; border: var(--b); border-radius: var(--r); box-shadow: var(--s-lg); overflow: hidden; background: var(--paper); }
.mod-item { display: flex; gap: 12px; align-items: flex-start; padding: 18px; border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); margin: 0 -3px -3px 0; animation: carimbo .25s cubic-bezier(.2,.9,.3,1) both; }
.mod-item > svg { flex: none; margin-top: 2px; width: 22px; height: 22px; padding: 3px; border: 2px solid var(--ink); border-radius: 4px; background: var(--verde); color: #111; box-sizing: content-box; }
.mod-item b { display: block; font-size: 16px; font-weight: 800; line-height: 1.2; }
.mod-item span { display: block; margin-top: 4px; font-size: 14px; }
@media (max-width: 640px) {
  .mod-abas { flex-wrap: nowrap; overflow-x: auto; padding: 0 20px 10px; margin-inline: -20px; scrollbar-width: none; }
  .mod-aba { flex: none; }
}

/* Fluxo: o canvas do construtor emoldurado */
.fx {
  --fx-bg: var(--paper-2); --fx-card: var(--paper); --fx-fg: var(--ink); --fx-muted: var(--ink);
  --fx-border: var(--ink); --fx-input: var(--ink); --fx-secondary: color-mix(in srgb, var(--azul) 14%, var(--paper));
  --fx-brand: var(--azul); --fx-amarelo: #B38F00; --fx-verde: #1F8A1F; --fx-azul: var(--azul); --fx-marinho: var(--ink);
  --fx-success: #1F8A1F; --fx-attention: var(--amarelo); --fx-aresta: var(--ink); --fx-ponto: color-mix(in srgb, var(--ink) 30%, transparent);
  margin-top: 24px; border: 4px solid var(--ink); border-radius: var(--r); position: relative; overflow: hidden;
  background-color: var(--fx-bg); box-shadow: var(--s-xl);
  background-image: radial-gradient(var(--fx-ponto) 1.5px, transparent 1.5px); background-size: 20px 20px;
}
.fx-rolagem { overflow-x: auto; overscroll-behavior-x: contain; }
.fx-mundo { position: relative; transform-origin: 0 0; color: var(--fx-fg); line-height: 1.5; }
.fx-arestas { position: absolute; inset: 0; max-width: none; overflow: visible; pointer-events: none; }
.fx-arestas path { fill: none; stroke: var(--fx-aresta); stroke-width: 3; }
.fx-arestas path.percorrida { stroke: var(--azul); stroke-width: 4; stroke-dasharray: 10 6; animation: fx-traco .4s linear infinite; }
@keyframes fx-traco { to { stroke-dashoffset: -16; } }
.fx-bloco { position: absolute; border: 3px solid var(--ink); border-radius: var(--r); background: var(--fx-card); font-size: 14px; box-shadow: var(--s); }
.fx-bloco.fora { opacity: .45; }
.fx-bloco.atual { box-shadow: 6px 6px 0 0 var(--azul); }
.fx-cab { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 3px solid var(--ink); font-weight: 900; }
.fx-cab svg { flex: none; }
.fx-exec { display: flex; align-items: center; gap: 8px; padding: 6px 14px; border-bottom: 3px solid var(--ink); background: var(--verde); color: #111; font-family: var(--mono); font-size: 12px; font-weight: 700; }
.fx-exec b { display: flex; align-items: center; gap: 4px; }
.fx-resposta { display: flex; flex-direction: column; gap: 16px; }
.fx-resposta section { display: flex; flex-direction: column; gap: 8px; }
.fx-rot { margin: 0; font-family: var(--mono); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.fx-dm { border-top: 3px solid var(--ink); padding-top: 12px; }
.fx-botao { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 12px; border: 2px solid var(--ink); border-radius: var(--r-sm); background: var(--amarelo); color: #111; font-size: 12px; font-weight: 800; }
.fx-resumo { padding: 10px 14px; font-size: 12px; white-space: pre-wrap; }
.fx-previa { padding: 14px; }
.fx-balao { margin: 0; border: 2px solid var(--ink); border-radius: var(--r-sm); background: var(--fx-secondary); padding: 8px 12px; font-size: 14px; line-height: 1.5; }
.fx-saida-unica { position: relative; height: 32px; }
.fx-saidas { border-top: 3px solid var(--ink); padding-block: 6px; }

.fx-alca { position: absolute; right: 0; top: 50%; transform: translate(50%, -50%); width: 26px; height: 26px; border-radius: 4px; display: flex; align-items: center; justify-content: center; background: var(--amarelo); color: #111; border: 2px solid var(--ink); z-index: 1; }
.fx-entrada { position: absolute; left: 0; top: 24px; width: 12px; height: 12px; background: var(--ink); transform: translate(-50%, -50%); z-index: 1; }
.fx-nota { position: absolute; border: 3px solid var(--ink); border-radius: var(--r); padding: 12px; font-size: 13px; font-weight: 600; white-space: pre-wrap; background: var(--amarelo); color: #111; box-shadow: var(--s); transform: rotate(-1.5deg); }
.fx-abas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 40px; }
.fx-aba {
  min-height: 44px; padding: 8px 16px; border: var(--b); border-radius: var(--r); background: var(--paper); cursor: pointer;
  font-size: 15px; font-weight: 800; color: var(--ink); box-shadow: var(--s); transition: transform var(--snap), box-shadow var(--snap);
}
.fx-aba:hover { transform: translate(-1px, -1px); box-shadow: 6px 6px 0 0 var(--ink); }
.fx-aba.on { background: var(--amarelo); color: #111; transform: translate(4px, 4px); box-shadow: none; }
.fx-dica { display: none; align-items: center; gap: 6px; margin: 16px 0 0; font-family: var(--mono); font-size: 12px; font-weight: 700; text-transform: uppercase; }
@media (max-width: 760px) { .fx-dica { display: flex; } }

/* Recursos: bento de tamanhos diferentes */
.recursos { margin-top: 56px; display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 28px; }
.rec {
  grid-column: span 4; position: relative; padding: 28px; border: var(--b); border-radius: var(--r); background: var(--paper);
  box-shadow: var(--s-lg); transition: transform var(--snap), box-shadow var(--snap);
}
.rec:hover { transform: translate(-2px, -2px); box-shadow: var(--s-xl); }
.rec:nth-child(1) { grid-column: span 8; background: var(--amarelo); color: #111; }
.rec:nth-child(1) h3 { font-size: clamp(28px, 3vw, 44px); }
.rec:nth-child(1) p { font-size: 18px; max-width: 46ch; }
.rec:nth-child(2) { background: var(--azul); color: #fff; }
.rec:nth-child(2) .ic { background: var(--amarelo); color: #111; }
.rec:nth-child(5) { background: var(--verde); color: #111; }
.rec:nth-child(7) { grid-column: span 8; }
.rec:nth-child(8) { background: var(--azul); color: #fff; }
.rec:nth-child(8) .ic { background: var(--amarelo); color: #111; }
.rec:nth-child(9) { background: var(--amarelo); color: #111; }
.rec:nth-child(12) { grid-column: span 8; background: var(--verde); color: #111; }
.rec:nth-child(5) .ic, .rec:nth-child(9) .ic, .rec:nth-child(12) .ic, .rec:nth-child(1) .ic { background: #fff; color: #111; }
@media (max-width: 1000px) { .rec, .rec:nth-child(1), .rec:nth-child(7), .rec:nth-child(12) { grid-column: span 6; } }
@media (max-width: 640px) { .recursos { grid-template-columns: minmax(0, 1fr); } .rec, .rec:nth-child(1), .rec:nth-child(7), .rec:nth-child(12) { grid-column: auto; } }
.rec h3 { font-size: 22px; margin-top: 20px; }
.rec p { margin-top: 10px; font-size: 15px; }
.rec .plano-tag {
  position: absolute; top: -14px; right: 16px; font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  padding: 3px 8px; border: 2px solid #111; border-radius: 4px; background: #fff; color: #111; box-shadow: 3px 3px 0 0 #111;
}

/* Calculadora */
.calc { margin-top: 56px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; }
@media (max-width: 860px) { .calc { grid-template-columns: minmax(0, 1fr); } }
.calc-box { padding: clamp(20px, 4vw, 36px); border: var(--b); border-radius: var(--r); background: var(--paper); box-shadow: var(--s-lg); }
.campo + .campo { margin-top: 32px; }
.campo label { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 800; }
.campo output { font-weight: 900; font-size: 18px; padding: 2px 8px; border: 2px solid var(--ink); border-radius: 4px; background: var(--amarelo); color: #111; white-space: nowrap; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; margin-top: 16px; height: 28px; background: transparent; cursor: pointer; }
input[type=range]::-webkit-slider-runnable-track { height: 14px; border: 3px solid var(--ink); border-radius: 4px; background: var(--paper-2); }
input[type=range]::-moz-range-track { height: 8px; border: 3px solid var(--ink); border-radius: 4px; background: var(--paper-2); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; margin-top: -10px; border: 3px solid var(--ink); border-radius: 4px; background: var(--azul); box-shadow: 3px 3px 0 0 var(--ink); }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border: 3px solid var(--ink); border-radius: 4px; background: var(--azul); box-shadow: 3px 3px 0 0 var(--ink); }
.calc-res { background: var(--azul); color: #fff; display: flex; flex-direction: column; justify-content: center; box-shadow: var(--s-xl); }
.calc-res .num { font-weight: 900; font-size: clamp(56px, 9vw, 104px); line-height: .9; letter-spacing: -0.03em; }
.calc-res .rot { margin-top: 10px; font-weight: 700; }
.calc-res hr { border: 0; border-top: 3px solid #111; margin: 24px 0; width: 100%; }
.calc-res .aviso { font-family: var(--mono); font-size: 12px; font-weight: 700; margin-top: 16px; }

/* Planos: o destacado é erguido com sombra maior */
.planos { margin-top: 56px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px; align-items: stretch; }
@media (max-width: 1100px) { .planos { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) { .planos { grid-template-columns: minmax(0, 1fr); } }
.plano { display: flex; flex-direction: column; padding: 28px 24px; border: var(--b); border-radius: var(--r); background: var(--paper); box-shadow: var(--s-lg); position: relative; }
.plano.dest { background: var(--amarelo); color: #111; box-shadow: 12px 12px 0 0 var(--ink); }
@media (min-width: 1101px) { .plano.dest { translate: 0 -16px; } }
.plano .badge {
  position: absolute; top: -16px; left: 16px; background: var(--azul); color: #fff; border: 2px solid #111; border-radius: 4px; box-shadow: 3px 3px 0 0 #111;
  font-family: var(--mono); font-weight: 700; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; padding: 4px 10px; white-space: nowrap; transform: rotate(-2deg);
}
.plano h3 { font-size: 28px; font-weight: 900; }
.plano .desc { font-size: 14px; margin-top: 10px; min-height: 66px; }
.preco { margin-top: 20px; display: flex; align-items: baseline; gap: 4px; padding-block: 12px; border-block: 3px solid currentColor; }
.plano.dest .preco { border-color: #111; }
.preco .rs { font-weight: 800; }
.preco .val { font-weight: 900; font-size: 52px; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.preco .per { font-weight: 700; }
.pequeno { font-family: var(--mono); font-size: 12px; font-weight: 700; margin-top: 10px; min-height: 20px; }
.plano ul { list-style: none; padding: 0; margin: 24px 0; display: grid; gap: 10px; flex: 1; align-content: start; }
.plano li { display: flex; gap: 10px; font-size: 15px; font-weight: 600; align-items: flex-start; }
.plano li svg { flex: none; margin-top: 3px; }
.plano .btn { width: 100%; }
.plano.dest .btn { background: var(--azul); color: #fff; border-color: #111; box-shadow: 4px 4px 0 0 #111; }
.plano.dest .btn:hover { box-shadow: 6px 6px 0 0 #111; }
.plano.dest .btn:active { box-shadow: none; }
.plano.dest h3 { margin-top: 8px; }
.teste { margin-top: 32px; padding: 14px 18px; border: var(--b); border-radius: var(--r); background: var(--paper-2); font-size: 15px; }
.teste svg { display: inline-block; vertical-align: -4px; margin-right: 8px; }
.teste + .teste { margin-top: 16px; }
.teste a { font-weight: 800; }
.arraste { display: none; }
.adicionais-bloco { margin-top: 64px; }
.adicionais-bloco h3 { font-size: clamp(28px, 3vw, 44px); }
.adicionais-bloco > p { margin-top: 12px; max-width: 60ch; font-size: 16px; }
.adicionais { margin-top: 28px; display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(min(170px, 100%), 1fr)); }
.adicional { border: var(--b); border-radius: var(--r); background: var(--paper); box-shadow: var(--s); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.adicional:nth-child(3n+1) { background: var(--verde); color: #111; }
.adicional b { font-size: 16px; font-weight: 800; line-height: 1.2; }
.adicional span { font-family: var(--mono); font-size: 12px; font-weight: 700; }
.tabela-wrap { margin-top: 56px; overflow-x: auto; border: var(--b); border-radius: var(--r); box-shadow: var(--s-lg); background: var(--paper); -webkit-overflow-scrolling: touch; }
table { width: 100%; min-width: 640px; border-collapse: collapse; table-layout: fixed; font-size: 15px; }
th, td { padding: 14px 16px; text-align: center; border-bottom: 3px solid var(--ink); border-left: 3px solid var(--ink); }
th:first-child, td:first-child { border-left: 0; text-align: left; width: 34%; position: sticky; left: 0; background: var(--paper); font-weight: 700; box-shadow: 3px 0 0 0 var(--ink); }
thead th { font-weight: 900; font-size: 16px; background: var(--paper-2); }
thead th:first-child { background: var(--paper-2); }
thead th.dest { background: var(--amarelo); color: #111; }
tbody tr:last-child td { border-bottom: 0; }
td .sim { display: inline-flex; padding: 2px; border: 2px solid var(--ink); border-radius: 4px; background: var(--verde); color: #111; }
td .nao { display: inline-block; opacity: .55; }

/* FAQ */

.pergunta[data-aberta="true"] button { background: var(--amarelo); color: #111; border-bottom: 3px solid var(--ink); }
.pergunta button svg { flex: none; width: 32px; height: 32px; padding: 4px; border: 2px solid currentColor; border-radius: 4px; box-sizing: border-box; }
.pergunta[data-aberta="true"] button svg { transform: rotate(180deg); }
.resposta { display: none; }
.pergunta[data-aberta="true"] .resposta { display: block; }
.resposta p { padding: 18px 20px 20px; }
.resposta a { font-weight: 800; text-decoration-thickness: 2px; }

.cta .h2 { color: #fff; font-size: clamp(40px, 6.6vw, 96px); font-weight: 900; letter-spacing: -0.03em; line-height: .92; max-width: 14ch; margin-top: 0; }

.rodape li a:hover { border-bottom-color: var(--amarelo); }
.rodape .empresa { margin-top: 16px; font-size: 14px; line-height: 1.7; }
.rodape-marca { display: inline-flex; padding: 8px 12px; border: 3px solid var(--paper); border-radius: var(--r); }
.rodape-base { margin-top: 40px; padding-top: 24px; border-top: 3px solid var(--paper); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-family: var(--mono); font-size: 12px; font-weight: 700; }

  .flutuante { width: 56px; height: 56px; min-height: 0; padding: 0; justify-content: center; right: 12px; bottom: 12px; }

}

  function Icon({ n, s = 22, w = 2 }) {
    const partes = (IC[n] || []).map((p, i) => {
      if (typeof p === 'string') return html`<path key=${i} d=${p} />`;
      if (p.c) return html`<circle key=${i} cx=${p.c[0]} cy=${p.c[1]} r=${p.c[2]} />`;
      return html`<rect key=${i} x=${p.r[0]} y=${p.r[1]} width=${p.r[2]} height=${p.r[3]} rx=${p.r[4]} />`;
    });
    return html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth=${w} strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">${partes}</svg>`;
  }

  // Revela elementos .rev quando entram na tela
  function useRevelar() {
    useEffect(() => {
      const els = document.querySelectorAll('.rev');
      if (!('IntersectionObserver' in window)) { els.forEach((e) => e.classList.add('vis')); return; }
      const io = new IntersectionObserver((entradas) => {
        entradas.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('vis'); io.unobserve(e.target); } });
      }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
      els.forEach((e) => io.observe(e));
      return () => io.disconnect();
    }, []);
  }

  const ORDEM_CENAS = Object.keys(CENAS);
  function ChatCelular() {
    const [cena, setCena] = useState('whatsapp');
    const c = CENAS[cena];
    const total = c.roteiro.length;
    const [passo, setPasso] = useState(reduz ? total : 0);
    // Quem está digitando: 'lead' aparece no topo (como no app), 'bot' aparece como bolinhas na conversa
    const [digitando, setDigitando] = useState(null);
    const trocar = (nova) => { setCena(nova); setPasso(reduz ? CENAS[nova].roteiro.length : 0); setDigitando(null); };
    useEffect(() => {
      if (reduz) return;
      if (passo >= total) {
        const t = setTimeout(() => trocar(ORDEM_CENAS[(ORDEM_CENAS.indexOf(cena) + 1) % ORDEM_CENAS.length]), 4200);
        return () => clearTimeout(t);
      }
      const prox = c.roteiro[passo];
      const ehBot = prox.t === 'bot' || prox.t === 'publica';
      setDigitando(ehBot ? 'bot' : prox.t === 'lead' ? 'lead' : null);
      const t = setTimeout(() => { setDigitando(null); setPasso(passo + 1); }, ehBot ? 1500 : passo === 0 ? 900 : 1200);
      return () => clearTimeout(t);
    }, [passo, cena]);
    const visiveis = c.roteiro.slice(0, passo).slice(-6);
    const item = (m, i) => {
      const k = cena + passo + '-' + i;
      if (m.t === 'arquivo') return html`<div key=${k} className="msg lead arquivo"><span className="doc">PDF</span><span>${m.x}</span></div>`;
      if (m.t === 'comentario') return html`<div key=${k} className="msg comentario"><small>Comentou no seu anúncio</small>${m.x}</div>`;
      if (m.t === 'publica') return html`<div key=${k} className="msg publica"><small>Resposta pública ao comentário</small>${m.x}</div>`;
      return html`<div key=${k} className=${'msg ' + m.t}>${m.t === 'bot' ? html`<span className="quem">Agente IA</span>` : null}${m.x}${m.botao ? html`<span className="botao-msg">${m.botao}</span>` : null}</div>`;
    };
    return html`<div className="celular-area rev" style=${{ '--d': '200ms' }}>
      <div className="celular" role="img" aria-label=${c.aria}>
        <div className=${'tela' + ({ whatsapp: '', instagram: ' ig', messenger: ' ms', telegram: ' tg' }[cena] ?? '')}>
          <div className="tela-topo">
            <div className="avatar">A</div>
            <div><b>${c.nome}</b><small>${digitando === 'lead' ? 'digitando…' : c.sub}</small></div>
          </div>
          <div className="msgs">
            ${visiveis.map(item)}
            ${digitando === 'bot' ? html`<div className="digitando"><i></i><i></i><i></i></div>` : null}
          </div>
        </div>
      </div>
      ${passo >= total ? html`<div className="venda" key=${'v' + cena}><${Icon} n=${c.fim.ic} s=${28} /><div><b>${c.fim.t}</b><small>${c.fim.s}</small></div></div>` : null}
      <div className="chip-ia"><${Icon} n="brilho" s=${16} /> Atendido pela IA, 24h</div>
    </div>`;
  }

  function useContagem(alvo) {
    const [v, setV] = useState(alvo);
    const atual = useRef(alvo);
    useEffect(() => {
      if (reduz) { setV(alvo); atual.current = alvo; return; }
      const de = atual.current; const ini = performance.now(); let raf;
      const passo = (agora) => {
        const p = Math.min(1, (agora - ini) / 650); const e = 1 - Math.pow(1 - p, 3);
        const n = de + (alvo - de) * e; atual.current = n; setV(n);
        if (p < 1) raf = requestAnimationFrame(passo);
      };
      raf = requestAnimationFrame(passo);
      return () => cancelAnimationFrame(raf);
    }, [alvo]);
    return v;
  }
  function Preco({ valor }) {
    const v = useContagem(valor);

  function useBotaoFlutuante() {
    const [some, setSome] = useState(true);
    useEffect(() => {
      const alvos = document.querySelectorAll('.hero-ctas, .rodape');
      if (!('IntersectionObserver' in window)) { setSome(false); return; }
      const visiveis = new Set();
      const io = new IntersectionObserver((entradas) => {
        entradas.forEach((e) => (e.isIntersecting ? visiveis.add(e.target) : visiveis.delete(e.target)));
        setSome(visiveis.size > 0);
      });
      alvos.forEach((a) => io.observe(a));
      return () => io.disconnect();
    }, []);
    return some;
  }

  function App() {
    useRevelar();
    const someBotao = useBotaoFlutuante();
