<style>
:root {
  --azul: #0E73E8;
  --azul-claro: #3D92F2;
  --marinho: #03235C;
  --verde: #4CC84C;
  --amarelo: #F7D400;
  --bg: #F4F7FB;
  --surface: #FFFFFF;
  --surface-2: #EAF0F8;
  --fg: #03235C;
  --muted: #4A5B7A;
  --line: rgba(3, 35, 92, 0.10);
  --shadow: 0 1px 2px rgba(3,35,92,.06), 0 8px 24px rgba(3,35,92,.08);
  --radius: 16px;
  --font-title: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #070E1D;
    --surface: #0D1830;
    --surface-2: #13213F;
    --fg: #EAF1FC;
    --muted: #9AABC8;
    --line: rgba(234, 241, 252, 0.10);
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-wrap: break-word;
}
img, svg { display: block; max-width: 100%; }
a { color: inherit; }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--font-title); line-height: 1.15; margin: 0; letter-spacing: -0.02em; }
p { margin: 0; }
.wrap { width: min(1180px, 100% - 32px); margin-inline: auto; }
.section { padding-block: clamp(64px, 10vw, 120px); position: relative; }
.eyebrow {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-title); font-weight: 700; font-size: 13px;
  letter-spacing: .08em; text-transform: uppercase; color: var(--azul);
}
@media (prefers-color-scheme: dark) { .eyebrow { color: var(--azul-claro); } }
.h2 { font-size: clamp(28px, 4.5vw, 48px); font-weight: 800; margin-top: 12px; }
.lead { font-size: clamp(16px, 1.6vw, 19px); color: var(--muted); margin-top: 16px; max-width: 640px; }
.center { text-align: center; }
.center .lead { margin-inline: auto; }
.grad {
  /* Gradiente que começa e termina na mesma cor: a animação dá a volta sem salto */
  background-image: linear-gradient(100deg, var(--azul), #1F9A4A, var(--azul));
  background-size: 200% auto;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  animation: brilho 6s linear infinite;
}
.meta .grad { background-image: linear-gradient(100deg, var(--azul-claro), var(--verde), var(--amarelo), var(--verde), var(--azul-claro)); }
@media (prefers-color-scheme: dark) { .grad { background-image: linear-gradient(100deg, var(--azul-claro), var(--verde), var(--amarelo), var(--verde), var(--azul-claro)); } }
@keyframes brilho { to { background-position: 200% center; } }

/* Botões */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 22px; border-radius: 999px; border: 0;
  font-family: var(--font-title); font-weight: 700; font-size: 16px;
  text-decoration: none; cursor: pointer; white-space: nowrap;
  transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--azul); color: #fff; box-shadow: 0 8px 24px rgba(14,115,232,.35); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(14,115,232,.45); }
.btn-ghost { background: var(--surface); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line); }
.btn-ghost:hover { transform: translateY(-2px); }
.btn-amarelo { background: var(--amarelo); color: var(--marinho); box-shadow: 0 8px 24px rgba(247,212,0,.35); }
.btn-amarelo:hover { transform: translateY(-2px); }
.btn:focus-visible, a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--azul-claro); outline-offset: 3px; }
.btn .seta { transition: transform .2s ease; }
.btn:hover .seta { transform: translateX(4px); }

/* Logo */
.logo { height: 34px; width: auto; }
.logo-d { display: none; }
@media (prefers-color-scheme: dark) { .logo-l { display: none; } .logo-d { display: block; } }

/* Barra */
.nav {
  position: fixed; inset: 0 0 auto 0; z-index: 50;
  transition: background .25s ease, box-shadow .25s ease;
}
.nav.solida {
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  box-shadow: 0 1px 0 var(--line);
}
.nav-in { display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 72px; }
.nav-links { display: flex; align-items: center; gap: 28px; }
.nav-links a { text-decoration: none; font-weight: 500; color: var(--muted); transition: color .2s; }
.nav-links a:hover { color: var(--fg); }
.nav-acoes { display: flex; align-items: center; gap: 12px; }
.nav-acoes .btn { min-height: 44px; padding: 0 18px; font-size: 15px; }
.menu-btn { display: none; width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); cursor: pointer; align-items: center; justify-content: center; }
.gaveta { display: none; }
@media (max-width: 860px) {
  .nav-links, .nav-acoes .entrar { display: none; }
  .menu-btn { display: inline-flex; }
  .gaveta {
    display: flex; flex-direction: column; gap: 4px;
    position: fixed; inset: 72px 0 auto 0; padding: 12px 16px 20px;
    background: var(--bg); box-shadow: 0 12px 24px rgba(3,35,92,.15);
    transform: translateY(-12px); opacity: 0; pointer-events: none;
    transition: transform .25s ease, opacity .25s ease;
  }
  .gaveta.aberta { transform: none; opacity: 1; pointer-events: auto; }
  .gaveta a:not(.btn) { padding: 12px 8px; min-height: 44px; text-decoration: none; font-weight: 600; border-bottom: 1px solid var(--line); }
  .gaveta .btn { margin-top: 12px; }
}
@media (max-width: 380px) { .nav-acoes .btn-primary { display: none; } }

/* Topo */
.hero { padding-top: 128px; padding-bottom: clamp(56px, 8vw, 96px); overflow: hidden; position: relative; }
.blob { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .45; pointer-events: none; animation: flutua 14s ease-in-out infinite alternate; }
.blob.b1 { width: 420px; height: 420px; background: var(--azul); top: -120px; left: -140px; }
.blob.b2 { width: 360px; height: 360px; background: var(--verde); top: 120px; right: -120px; animation-delay: -4s; opacity: .3; }
.blob.b3 { width: 260px; height: 260px; background: var(--amarelo); bottom: -80px; left: 40%; animation-delay: -8s; opacity: .25; }
@keyframes flutua { to { transform: translate(40px, 30px) scale(1.12); } }
.hero-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, .9fr); gap: clamp(32px, 5vw, 64px); align-items: center; position: relative; }
@media (max-width: 920px) { .hero-grid { grid-template-columns: minmax(0, 1fr); } }
.selo-topo {
  display: inline-flex; align-items: center; gap: 8px; max-width: 100%;
  padding: 6px 14px 6px 8px; border-radius: 999px; line-height: 1.3;
  background: var(--surface); box-shadow: inset 0 0 0 1px var(--line), var(--shadow);
  font-size: 14px; font-weight: 600;
}
.selo-topo .pill { background: var(--verde); color: #04310a; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 700; }
.hero h1 { font-size: clamp(34px, 5vw, 60px); font-weight: 800; margin-top: 20px; }
.hero .lead { max-width: 560px; }
.hero-ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
.hero-nota { margin-top: 14px; font-size: 14px; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
.hero-nota span { display: inline-flex; align-items: center; gap: 6px; }
.hero-nota svg { color: var(--verde); }

/* Celular */
.celular-area { position: relative; display: flex; justify-content: center; }
.celular {
  width: min(340px, 100%); aspect-ratio: 9 / 18.5;
  border-radius: 44px; padding: 12px; background: #0A1428;
  box-shadow: 0 30px 80px rgba(3,35,92,.35), inset 0 0 0 2px rgba(255,255,255,.08);
  animation: balanca 7s ease-in-out infinite;
  position: relative;
}
@keyframes balanca { 0%,100% { transform: rotate(-2deg) translateY(0); } 50% { transform: rotate(1deg) translateY(-12px); } }
.tela { height: 100%; border-radius: 34px; overflow: hidden; background: #0B141A; display: flex; flex-direction: column; }
.tela-topo { display: flex; align-items: center; gap: 10px; padding: 18px 16px 12px; background: #1F2C34; color: #E9EDEF; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--azul), var(--verde)); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 14px; flex: none; }
.tela-topo b { font-size: 14px; display: block; }
.tela-topo small { font-size: 11px; color: #8FA3AE; }
.msgs { flex: 1; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; justify-content: flex-end; overflow: hidden;
  background-image: radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px); background-size: 14px 14px; }
.msg { max-width: 82%; padding: 7px 10px 6px; border-radius: 10px; font-size: 13px; line-height: 1.4; color: #E9EDEF; animation: entra .35s cubic-bezier(.2,.9,.3,1.3) both; }
.msg.lead { align-self: flex-start; background: #1F2C34; border-top-left-radius: 2px; }
.msg.bot { align-self: flex-end; background: #005C4B; border-top-right-radius: 2px; }
.msg .quem { display: block; font-size: 10px; font-weight: 700; color: #7FD4C1; margin-bottom: 2px; }
.msg.arquivo { display: flex; align-items: center; gap: 8px; }
.msg.arquivo .doc { width: 28px; height: 34px; border-radius: 4px; background: #E9EDEF; color: #C0392B; display: grid; place-items: center; font-size: 9px; font-weight: 800; flex: none; }
.digitando { align-self: flex-end; background: #005C4B; border-radius: 10px; padding: 10px 12px; display: flex; gap: 4px; animation: entra .3s both; }
.digitando i { width: 6px; height: 6px; border-radius: 50%; background: #CFE9E2; animation: pulo 1s infinite; }
.digitando i:nth-child(2) { animation-delay: .15s; } .digitando i:nth-child(3) { animation-delay: .3s; }
@keyframes pulo { 0%,60%,100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-4px); opacity: 1; } }
@keyframes entra { from { opacity: 0; transform: translateY(10px) scale(.96); } to { opacity: 1; transform: none; } }
.venda {
  position: absolute; right: max(-12px, -2vw); top: 18%; z-index: 2;
  background: var(--surface); color: var(--fg); border-radius: 16px; padding: 12px 16px;
  box-shadow: 0 16px 40px rgba(3,35,92,.25); display: flex; gap: 12px; align-items: center;
  animation: pop .6s cubic-bezier(.2,.9,.3,1.5) both;
}
.venda svg { color: var(--verde); }
.venda b { font-family: var(--font-title); display: block; font-size: 15px; }
.venda small { color: var(--muted); font-size: 12px; }
@keyframes pop { from { opacity: 0; transform: scale(.6) translateY(20px); } to { opacity: 1; transform: none; } }
.chip-ia {
  position: absolute; left: max(-8px, -2vw); bottom: 16%; z-index: 2;
  background: var(--marinho); color: #fff; border-radius: 999px; padding: 10px 16px;
  font-size: 13px; font-weight: 600; display: flex; gap: 8px; align-items: center;
  box-shadow: 0 12px 30px rgba(3,35,92,.35); animation: flutua2 5s ease-in-out infinite;
}
.chip-ia svg { color: var(--amarelo); }
@keyframes flutua2 { 50% { transform: translateY(-10px); } }

/* Faixa de confiança */
.faixa-meta { margin-top: clamp(40px, 6vw, 64px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; }
.faixa-item { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 14px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-weight: 600; font-size: 14px; }
.faixa-item svg { color: var(--azul); flex: none; }
@media (prefers-color-scheme: dark) { .faixa-item svg { color: var(--azul-claro); } }

/* Seção Meta */
.meta { background: var(--marinho); color: #EAF1FC; overflow: hidden; }
.meta .lead { color: #B8C7E2; }
.meta .eyebrow { color: var(--amarelo); }
.meta-bg { position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px); background-size: 48px 48px; mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%); -webkit-mask-image: radial-gradient(ellipse at 50% 0%, #000 30%, transparent 75%); pointer-events: none; }
.selao {
  margin: 40px auto 0; width: fit-content; max-width: 100%;
  display: flex; align-items: center; gap: 16px; padding: 16px 24px; border-radius: 20px;
  background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,.14);
}
.selao .escudo { color: var(--amarelo); flex: none; animation: brilhaEscudo 3s ease-in-out infinite; }
@keyframes brilhaEscudo { 50% { filter: drop-shadow(0 0 14px rgba(247,212,0,.7)); transform: scale(1.06); } }
.selao b { font-family: var(--font-title); font-size: clamp(16px, 2.4vw, 22px); display: block; }
.selao small { color: #B8C7E2; font-size: 14px; }
.meta-grid { margin-top: 48px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 16px; }
.meta-card { padding: 24px; border-radius: var(--radius); background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); transition: transform .3s ease, background .3s ease; }
.meta-card:hover { transform: translateY(-6px); background: rgba(255,255,255,.08); }
.meta-card svg { color: var(--verde); }
.meta-card h3 { font-size: 19px; margin-top: 16px; }
.meta-card p { color: #B8C7E2; margin-top: 8px; font-size: 15px; }
.compara { margin-top: 48px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.compara-col { padding: 24px; border-radius: var(--radius); }
.compara-col.ruim { background: rgba(255,255,255,.03); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.compara-col.bom { background: linear-gradient(160deg, rgba(14,115,232,.35), rgba(76,200,76,.18)); box-shadow: inset 0 0 0 1px rgba(76,200,76,.45); }
.compara-col h3 { font-size: 18px; display: flex; align-items: center; gap: 10px; }
.compara-col ul { list-style: none; padding: 0; margin: 16px 0 0; display: grid; gap: 12px; }
.compara-col li { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; color: #D5E0F2; }
.compara-col li svg { flex: none; margin-top: 3px; }
.ruim li svg { color: #FF7A7A; }
.bom li svg { color: var(--verde); }
.nota-marca { margin-top: 32px; font-size: 13px; color: #8EA2C6; text-align: center; }

/* Canais */
.canais { padding-block: 40px; overflow: hidden; border-block: 1px solid var(--line); }
.trilho { display: flex; width: max-content; animation: rola 28s linear infinite; }
.trilho:hover { animation-play-state: paused; }
.trilho-grupo { display: flex; align-items: center; gap: clamp(48px, 7vw, 96px); padding-right: clamp(48px, 7vw, 96px); }
.logo-canal { width: clamp(40px, 5vw, 56px); height: auto; aspect-ratio: 1; object-fit: contain; transition: transform .25s ease; }
.logo-canal:hover { transform: scale(1.15) rotate(-4deg); }
.canais-tit { text-align: center; font-weight: 600; color: var(--muted); font-size: 15px; margin: 0 16px 28px; }
.canal { display: flex; align-items: center; gap: 10px; font-family: var(--font-title); font-weight: 700; font-size: clamp(18px, 2.4vw, 24px); color: var(--muted); white-space: nowrap; }
.canal svg { color: var(--azul); }
.canal .tag-of { font-family: var(--font-body); font-size: 11px; font-weight: 700; color: var(--verde); text-transform: uppercase; letter-spacing: .06em; border: 1px solid currentColor; border-radius: 999px; padding: 1px 8px; }
@keyframes rola { to { transform: translateX(-50%); } }

/* Fluxo */
.fluxo { margin-top: 56px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; align-items: center; }
.no-wrap { display: flex; align-items: center; min-width: 0; }
.no {
  flex: 1; min-width: 0; padding: 16px; border-radius: 14px; background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--line), var(--shadow);
  opacity: 0; transform: translateY(24px) scale(.94);
  transition: opacity .5s ease, transform .6s cubic-bezier(.2,.9,.3,1.3), box-shadow .3s ease;
}
.fluxo.vis .no { opacity: 1; transform: none; }
.no .tipo { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; display: flex; gap: 6px; align-items: center; }
.no b { display: block; font-family: var(--font-title); margin-top: 6px; font-size: 15px; }
.no small { display: block; color: var(--muted); font-size: 13px; margin-top: 2px; }
.no.ativo { box-shadow: inset 0 0 0 2px var(--azul), 0 0 0 6px rgba(14,115,232,.15), var(--shadow); }
.liga { width: 28px; height: 3px; flex: none; position: relative; background: var(--line); border-radius: 2px; overflow: hidden; }
.liga::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, var(--azul), var(--verde)); transform: translateX(-100%); }
.fluxo.vis .liga::after { animation: corre 1.6s ease-in-out infinite; }
@keyframes corre { to { transform: translateX(100%); } }
@media (max-width: 860px) {
  .fluxo { grid-template-columns: minmax(0, 1fr); max-width: 420px; margin-inline: auto; }
  .no-wrap { flex-direction: column; align-items: stretch; }
  .liga { width: 3px; height: 24px; align-self: center; }
  .liga::after { background: linear-gradient(180deg, transparent, var(--azul), var(--verde)); transform: translateY(-100%); }
  .fluxo.vis .liga::after { animation-name: correV; }
}
@keyframes correV { to { transform: translateY(100%); } }

/* Recursos */
.recursos { margin-top: 56px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.rec {
  padding: 28px; border-radius: var(--radius); background: var(--surface);
  box-shadow: inset 0 0 0 1px var(--line); transition: transform .25s ease, box-shadow .25s ease;
  transform-style: preserve-3d; position: relative; overflow: hidden;
}
.rec::before { content: ""; position: absolute; inset: 0; background: radial-gradient(400px circle at var(--mx, 50%) var(--my, 0%), rgba(14,115,232,.12), transparent 50%); opacity: 0; transition: opacity .3s; pointer-events: none; }
.rec:hover::before { opacity: 1; }
.rec:hover { box-shadow: inset 0 0 0 1px rgba(14,115,232,.35), var(--shadow); }
.rec .ic { color: var(--azul); }
@media (prefers-color-scheme: dark) { .rec .ic { color: var(--azul-claro); } }
.rec h3 { font-size: 19px; margin-top: 18px; }
.rec p { color: var(--muted); margin-top: 8px; font-size: 15px; }
.rec .plano-tag { position: absolute; top: 20px; right: 20px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

/* Calculadora */
.calc { margin-top: 48px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 860px) { .calc { grid-template-columns: minmax(0, 1fr); } }
.calc-box { padding: clamp(20px, 4vw, 36px); border-radius: 20px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.campo + .campo { margin-top: 28px; }
.campo label { display: flex; justify-content: space-between; gap: 12px; font-weight: 600; }
.campo output { font-family: var(--font-title); font-weight: 800; color: var(--azul); }
input[type=range] { width: 100%; margin-top: 12px; accent-color: var(--azul); height: 28px; cursor: pointer; }
.calc-res { background: linear-gradient(150deg, var(--azul), var(--marinho)); color: #fff; display: flex; flex-direction: column; justify-content: center; }
.calc-res .num { font-family: var(--font-title); font-weight: 800; font-size: clamp(48px, 8vw, 80px); line-height: 1; }
.calc-res .rot { color: #CFE0FA; margin-top: 8px; }
.calc-res hr { border: 0; border-top: 1px solid rgba(255,255,255,.2); margin: 24px 0; width: 100%; }
.calc-res .aviso { font-size: 12px; color: #A9C2EA; margin-top: 16px; }

/* Planos */
.toggle { margin: 32px auto 0; width: fit-content; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); position: relative; }
.toggle button { min-height: 44px; padding: 0 20px; border: 0; background: transparent; border-radius: 999px; font-weight: 700; cursor: pointer; position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; transition: color .25s; color: var(--muted); }
.toggle button.on { color: #fff; }
.toggle .bolha { position: absolute; top: 4px; bottom: 4px; border-radius: 999px; background: var(--azul); transition: left .35s cubic-bezier(.2,.9,.3,1.2), width .35s; }
.toggle .ganhe { font-size: 11px; background: var(--amarelo); color: var(--marinho); padding: 2px 8px; border-radius: 999px; }
.confete { position: absolute; left: 50%; top: 50%; width: 8px; height: 12px; border-radius: 2px; pointer-events: none; animation: voa 1s ease-out forwards; }
@keyframes voa { to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; } }
.planos { margin-top: 40px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-items: stretch; }
@media (max-width: 1100px) { .planos { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) { .planos { grid-template-columns: minmax(0, 1fr); } }
.plano { display: flex; flex-direction: column; padding: 28px 24px; border-radius: 20px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); position: relative; transition: transform .3s ease; }
.plano:hover { transform: translateY(-6px); }
.plano.dest { background: var(--marinho); color: #fff; box-shadow: 0 0 0 2px var(--azul), 0 24px 60px rgba(14,115,232,.3); }
@media (min-width: 1101px) { .plano.dest { transform: scale(1.04); } .plano.dest:hover { transform: scale(1.04) translateY(-6px); } }
.plano .badge { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: var(--amarelo); color: var(--marinho); font-weight: 800; font-size: 12px; padding: 5px 14px; border-radius: 999px; white-space: nowrap; text-transform: uppercase; letter-spacing: .05em; }
.plano h3 { font-size: 22px; }
.plano .desc { color: var(--muted); font-size: 14px; margin-top: 8px; min-height: 66px; }
.plano.dest .desc, .plano.dest .pequeno { color: #B8C7E2; }
.preco { margin-top: 20px; display: flex; align-items: baseline; gap: 4px; }
.preco .rs { font-weight: 700; }
.preco .val { font-family: var(--font-title); font-weight: 800; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.preco .per { color: var(--muted); font-weight: 500; }
.plano.dest .preco .per { color: #B8C7E2; }
.pequeno { font-size: 13px; color: var(--muted); margin-top: 6px; min-height: 20px; }
.plano ul { list-style: none; padding: 0; margin: 24px 0; display: grid; gap: 10px; flex: 1; align-content: start; }
.plano li { display: flex; gap: 10px; font-size: 15px; align-items: flex-start; }
.plano li svg { color: var(--verde); flex: none; margin-top: 4px; }
.plano .btn { width: 100%; }
.assinar-agora { display: flex; align-items: center; justify-content: center; min-height: 44px; margin-bottom: -12px; font-size: 14px; font-weight: 600; color: #CFE0FA; }
.assinar-agora:hover { color: #fff; }
.exemplo { position: absolute; top: -28px; left: 50%; transform: translateX(-50%); font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.teste { margin-top: 28px; text-align: center; color: var(--muted); font-size: 15px; display: flex; justify-content: center; gap: 8px; align-items: center; flex-wrap: wrap; }
.teste svg { color: var(--verde); }
.tabela-wrap { margin-top: 48px; overflow-x: auto; border-radius: 16px; box-shadow: inset 0 0 0 1px var(--line); background: var(--surface); -webkit-overflow-scrolling: touch; }
table { width: 100%; min-width: 640px; border-collapse: collapse; table-layout: fixed; font-size: 15px; }
th, td { padding: 14px 16px; text-align: center; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; width: 34%; position: sticky; left: 0; background: var(--surface); }
thead th { font-family: var(--font-title); font-size: 15px; }
thead th.dest { color: var(--azul); }
tbody tr:last-child td { border-bottom: 0; }
td .sim { color: var(--verde); display: inline-block; }
td .nao { color: var(--muted); opacity: .5; display: inline-block; }

/* FAQ */
.faq { margin-top: 48px; max-width: 820px; margin-inline: auto; display: grid; gap: 12px; }
.pergunta { border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); overflow: hidden; }
.pergunta button { width: 100%; min-height: 64px; display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 16px 20px; background: none; border: 0; cursor: pointer; text-align: left; font-family: var(--font-title); font-weight: 700; font-size: 17px; }
.pergunta button svg { flex: none; transition: transform .3s ease; color: var(--muted); }
.pergunta.aberta button svg { transform: rotate(180deg); }
.resposta { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .35s ease; }
.pergunta.aberta .resposta { grid-template-rows: 1fr; }
.resposta > div { overflow: hidden; }
.resposta p { padding: 0 20px 20px; color: var(--muted); }
.resposta a { color: var(--azul); font-weight: 600; }

/* Chamada final */
.cta { border-radius: 28px; padding: clamp(40px, 7vw, 80px) clamp(20px, 5vw, 64px); text-align: center; color: #fff; position: relative; overflow: hidden;
  background: linear-gradient(135deg, var(--azul) 0%, var(--marinho) 70%); }
.cta::after { content: ""; position: absolute; width: 380px; height: 380px; border-radius: 50%; background: var(--verde); filter: blur(90px); opacity: .35; right: -100px; bottom: -160px; animation: flutua 10s ease-in-out infinite alternate; }
.cta > * { position: relative; z-index: 1; }
.cta .h2 { color: #fff; }
.cta .lead { color: #D3E2FA; margin-inline: auto; }
.cta .hero-ctas { justify-content: center; }

/* Rodapé */
.rodape { background: #050B18; color: #B8C7E2; padding-block: 56px 32px; margin-top: clamp(64px, 10vw, 120px); }
.rodape-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) repeat(2, minmax(0, 1fr)); gap: 32px; }
@media (max-width: 760px) { .rodape-grid { grid-template-columns: minmax(0, 1fr); } }
.rodape h4 { color: #fff; font-size: 15px; margin-bottom: 14px; }
.rodape ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.rodape li a { text-decoration: none; display: inline-flex; align-items: center; gap: 10px; min-height: 36px; transition: color .2s; }
.rodape li a:hover { color: #fff; }
.rodape .empresa { margin-top: 16px; font-size: 14px; line-height: 1.7; }
.rodape .empresa b { color: #fff; }
.rodape-base { margin-top: 40px; padding-top: 24px; border-top: 1px solid rgba(255,255,255,.1); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-size: 13px; color: #7F92B5; }

/* Botão flutuante */
.flutuante {
  position: fixed; right: 16px; bottom: 16px; z-index: 60;
  display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 20px;
  border-radius: 999px; background: var(--verde); color: #04310a; text-decoration: none;
  font-family: var(--font-title); font-weight: 800; box-shadow: 0 12px 32px rgba(76,200,76,.45);
  animation: chama 2.6s ease-in-out infinite;
}
@keyframes chama { 0%,100% { box-shadow: 0 12px 32px rgba(76,200,76,.45), 0 0 0 0 rgba(76,200,76,.5); } 50% { box-shadow: 0 12px 32px rgba(76,200,76,.45), 0 0 0 12px rgba(76,200,76,0); } }

/* Revelar ao rolar */
.rev { opacity: 0; transform: translateY(28px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0ms); }
.rev.vis { opacity: 1; transform: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
  .rev { opacity: 1; transform: none; }
  .no { opacity: 1; transform: none; }
}
noscript p { padding: 120px 16px; text-align: center; }

  function Icon({ n, s = 22, w = 2 }) {
    const partes = (IC[n] || []).map((p, i) => {
      if (typeof p === 'string') return html`<path key=${i} d=${p} />`;
      if (p.c) return html`<circle key=${i} cx=${p.c[0]} cy=${p.c[1]} r=${p.c[2]} />`;
      return html`<rect key=${i} x=${p.r[0]} y=${p.r[1]} width=${p.r[2]} height=${p.r[3]} rx=${p.r[4]} />`;
    });
    return html`<svg width=${s} height=${s} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth=${w} strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">${partes}</svg>`;
  }

  const reduz = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Revela elementos .rev quando entram na tela
  function useRevelar() {
    useEffect(() => {
      const els = document.querySelectorAll('.rev, .fluxo');
      if (!('IntersectionObserver' in window)) { els.forEach((e) => e.classList.add('vis')); return; }
      const io = new IntersectionObserver((entradas) => {
        entradas.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('vis'); io.unobserve(e.target); } });
      }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
      els.forEach((e) => io.observe(e));
      return () => io.disconnect();
    }, []);
  }

  function Logo({ escuro }) {
    if (escuro) return html`<img className="logo" src=${LOGO_D} alt="MacawChat" width="94" height="34" />`;
    return html`<span>
      <img className="logo logo-l" src=${LOGO_L} alt="MacawChat" width="94" height="34" />
      <img className="logo logo-d" src=${LOGO_D} alt="MacawChat" width="94" height="34" />
    </span>`;
  }

      f(); window.addEventListener('scroll', f, { passive: true });
      return () => window.removeEventListener('scroll', f);
    }, []);
    const links = [['#meta', 'API oficial'], ['#recursos', 'Recursos'], ['#planos', 'Planos'], ['#duvidas', 'Dúvidas']];
    const fechar = () => setAberta(false);
    return html`<header className=${'nav' + (solida || aberta ? ' solida' : '')}>

  // ===== Chat simulado =====
  const ROTEIRO = [
    { t: 'lead', x: 'Oi! Vi o anúncio do curso, ainda tem vaga?' },
    { t: 'bot', x: 'Oi, Ana! Tem sim. A turma começa segunda e o acesso é imediato.' },
    { t: 'bot', x: 'Quer que eu te mande o link com o desconto de hoje?' },
    { t: 'lead', x: 'Quero sim!' },
    { t: 'bot', x: 'Aqui está: o Pix vence em 30 minutos.' },
    { t: 'arquivo', x: 'comprovante.pdf' },
    { t: 'bot', x: 'Pagamento confirmado! Já liberei seu acesso. Bem-vinda!' },
    { t: 'venda' },
  ];
  function ChatCelular() {
    const [passo, setPasso] = useState(reduz ? ROTEIRO.length : 0);
    const [digitando, setDigitando] = useState(false);
    useEffect(() => {
      if (reduz) return;
      if (passo >= ROTEIRO.length) {
        const t = setTimeout(() => setPasso(0), 4200);
        return () => clearTimeout(t);
      }
      const prox = ROTEIRO[passo];
      const ehBot = prox.t === 'bot';
      if (ehBot) setDigitando(true);
      const t = setTimeout(() => { setDigitando(false); setPasso(passo + 1); }, ehBot ? 1500 : passo === 0 ? 700 : 1200);
      return () => clearTimeout(t);
    }, [passo]);
    const visiveis = ROTEIRO.slice(0, passo).filter((m) => m.t !== 'venda').slice(-6);
    const vendeu = passo >= ROTEIRO.length;
    return html`<div className="celular-area rev" style=${{ '--d': '200ms' }}>
      <span className="exemplo">Conversa de exemplo</span>
      <div className="celular" role="img" aria-label="Simulação de conversa: o robô do MacawChat atende o lead, envia o Pix, confere o comprovante e confirma a venda.">
        <div className="tela">
          <div className="tela-topo">
            <div className="avatar">A</div>
            <div><b>Ana Souza</b><small>${digitando ? 'MacawChat está digitando…' : 'online'}</small></div>
          </div>
          <div className="msgs">
            ${visiveis.map((m, i) => m.t === 'arquivo'
              ? html`<div key=${passo + '-' + i} className="msg lead arquivo"><span className="doc">PDF</span><span>${m.x}</span></div>`
              : html`<div key=${passo + '-' + i} className=${'msg ' + m.t}>${m.t === 'bot' ? html`<span className="quem">Agente IA</span>` : null}${m.x}</div>`)}
            ${digitando ? html`<div className="digitando"><i></i><i></i><i></i></div>` : null}
          </div>
        </div>
      </div>
      ${vendeu ? html`<div className="venda" key=${'v' + passo}><${Icon} n="badge" s=${28} /><div><b>Nova venda!</b><small>Curso completo · R$ 497,00</small></div></div>` : null}
      <div className="chip-ia"><${Icon} n="brilho" s=${16} /> Atendido pela IA, 24h</div>
    </div>`;
  }

  function useContagem(alvo) {
    const [v, setV] = useState(alvo);
    const atual = useRef(alvo);
    useEffect(() => {
      if (reduz) { setV(alvo); atual.current = alvo; return; }
      const de = atual.current; const ini = performance.now(); let raf;
      const passo = (agora) => {
        const p = Math.min(1, (agora - ini) / 650); const e = 1 - Math.pow(1 - p, 3);
        const n = de + (alvo - de) * e; atual.current = n; setV(n);
        if (p < 1) raf = requestAnimationFrame(passo);
      };
      raf = requestAnimationFrame(passo);
      return () => cancelAnimationFrame(raf);
    }, [alvo]);
    return v;
  }
  function Preco({ valor }) {

            <button aria-expanded=${aberta === i} aria-controls=${'r' + i} onClick=${() => setAberta(aberta === i ? -1 : i)}>${q}<${Icon} n="chevron" /></button>
